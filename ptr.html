<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Aviation, landscapes, portraits and wildlife by Montréal photographer Mingyao Li."
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Portraits · Mingyao Li Photography</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="app/site.css" />
    <link rel="stylesheet" href="app/wordmark.css" />
    <script type="module" src="app/site.js"></script>
  </head>
  <body data-page="portrait">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Mingyao Photography home"
        ><span class="logo-wordmark" aria-hidden="true"
          ><span class="logo-name">MINGYAO</span
          ><span class="logo-title">Photography</span></span
        ></a
      >
      <button
        class="menu-toggle"
        aria-label="Toggle navigation"
        aria-controls="navigation"
        aria-expanded="false"
      >
        <span class="menu-icon" aria-hidden="true"></span>
      </button>
      <nav id="navigation" aria-label="Main navigation">
        <a href="index.html" data-nav="portfolio">PORTFOLIO</a
        ><a href="ptr.html" data-nav="portrait">PORTRAIT</a
        ><a href="about_me.html" data-nav="about">ABOUT ME</a
        ><a href="contact.html" data-nav="contact">CONTACT</a>
      </nav>
    </header>
    <main id="main">
      <p class="loading" role="status">Opening the collection…</p>
    </main>
    <footer class="site-footer">
      <a class="footer-name" href="index.html">Mingyao Li</a>
      <div id="social-links"></div>
      <small id="copyright"></small
      ><a class="back-top" href="#">Back to top ↑</a>
    </footer>
    <dialog class="lightbox" aria-label="Photograph viewer">
      <header class="viewer-header">
        <div>
          <h2 class="lightbox-title"></h2>
          <p class="lightbox-category"></p>
        </div>
        <button class="lightbox-close" aria-label="Close photograph">
          Close <span aria-hidden="true">✕</span>
        </button>
      </header>
      <div class="viewer-stage"><img alt="" /></div>
      <footer class="viewer-footer">
        <div class="viewer-navigation">
          <button class="lightbox-prev" aria-label="Previous photograph">
            ←</button
          ><span class="lightbox-count" role="status" aria-live="polite"></span
          ><button class="lightbox-next" aria-label="Next photograph">→</button>
        </div>
        <a class="lightbox-original" target="_blank" rel="noopener noreferrer"
          >View original ↗</a
        >
      </footer>
    </dialog>
    <noscript
      ><p class="noscript">
        Please enable JavaScript to browse the photo collection. Contact
        <a href="mailto:MingyaoLee520@gmail.com">Mingyao by email</a>.
      </p></noscript
    >
  </body>
</html>
